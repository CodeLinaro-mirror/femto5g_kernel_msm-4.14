name: snapdragon-kernel
summary: snapdragon linux kernel
description: The Ubuntu kernel package as a snap

grade: stable
build-base: core22
confinement: strict
type: kernel

architectures:
  - build-on: [arm64, amd64]
    build-for: arm64

parts:
  kernel:
    plugin: kernel
    source: .
    source-type: git
    kconfigflavour: generic
    kconfigs:
      - CONFIG_DEBUG_INFO=n
    override-build: |
      cp debian/scripts/retpoline-extract-one \
        $SNAPCRAFT_PART_BUILD/scripts/ubuntu-retpoline-extract-one
      snapcraftctl build
    kernel-with-firmware: false
  firmware:
    plugin: nil
    stage-packages:
      - linux-firmware
    organize:
      lib/firmware: firmware
    prime:
      - -usr
      - -lib
    build-packages:
      - cpio
      - libssl-dev

build-packages:
  - bison
  - device-tree-compiler
  - dpkg-dev
  - flex
  - gcc
  - libfdt-dev
  - libssl-dev
  - mkbootimg
  - pahole
  - python3-cryptography
  - python3-pycryptodome
  - python3-pyelftools
  - python3-serial
  - rt5-clients
  - wget
