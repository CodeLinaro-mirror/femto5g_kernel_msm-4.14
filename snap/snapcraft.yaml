name: snapdragon-kernel
summary: snapdragon linux kernel
description: The Ubuntu kernel package as a snap

grade: stable
build-base: core22
confinement: strict
type: kernel
adopt-info: kernel

architectures:
  - build-on: [arm64, amd64]
    build-for: arm64

parts:
  kernel:
    plugin: kernel
    kernel-kdefconfig: [ "snappy_defconfig" ]
    kernel-image-target: Image.gz
    build-environment:
      - PATH: "/usr/lib/ccache:${PATH}"
    override-build: |
      craftctl default
      craftctl set version=$(git --git-dir=${CRAFT_PROJECT_DIR}/.git describe --tags | cut -c 14-42)-22
    prime:
      - -Image*
      - -kernel.img

  initrd:
    after:
      - firmware
      - kernel
    plugin: initrd
    initrd-stage-firmware: true
    initrd-firmware:
      - renesas_usb_fw.mem
    initrd-modules:
      - i2c-qcom-cci
      - i2c-qcom-geni
      - libarc4
      - mdt-loader
      - phy-qcom-qusb2
      - qcom_glink_smem
      - qmi-helpers
      - rtc-pm8xxx
      - slim_qcom_ngd_ctrl
      - slimbus
      - wcd934x
      - xhci-pci
      - xhci-pci-renesas
    override-prime: |
      craftctl default
      # Trim firmware
      trim_tool="https://git.launchpad.net/~canonical-kernel-snaps/+git/kernel-snaps-uc22/plain/trim-firmware"
      curl -s ${trim_tool} | bash /dev/stdin ${CRAFT_PRIME}
    prime:
      - -initrd*

  firmware:
    plugin: nil
    stage-packages:
      - linux-firmware
      - wireless-regdb
    override-pull: |
      for f in firmware-atheros firmware-qcom-dragonboard410c firmware-qcom-dragonboard820c firmware-qcom-dragonboard845c firmware-qcom-media firmware-qcom-soc
      do
        version="$(curl -s http://obs.linaro.org/linaro-overlay-sid/sid/Packages.gz | zcat | grep "${f}" |grep "Filename" | tail -1 | awk '{ print $2}' | cut -c3-)"
        echo "current_version=${version}"
        curl -O http://obs.linaro.org/linaro-overlay-sid/sid/${version}
      done
    override-build: |
      find ${SNAPCRAFT_PART_SRC} -name "*.deb" -exec dpkg -x {} ${SNAPCRAFT_PART_INSTALL} \;
    organize:
      lib/firmware: firmware
    prime:
      - firmware

  bootimg:
    plugin: nil
    after:
      - kernel
      - initrd
    override-build: |
      cat ${SNAPCRAFT_STAGE}/kernel.img \
          ${SNAPCRAFT_STAGE}/dtbs/qcom/apq8016-sbc.dtb \
          ${SNAPCRAFT_STAGE}/dtbs/qcom/apq8096-db820c.dtb \
          ${SNAPCRAFT_STAGE}/dtbs/qcom/sdm845-db845c.dtb \
          ${SNAPCRAFT_STAGE}/dtbs/qcom/sa8155p-adp.dtb \
          > Image.gz+dtbs
      mkbootimg \
        --kernel Image.gz+dtbs \
        --ramdisk ${SNAPCRAFT_STAGE}/initrd.img \
        --output ${SNAPCRAFT_PART_INSTALL}/boot.img \
        --pagesize 4096 \
        --base 0x80000000 \
        --kernel_offset 0x8000 \
        --ramdisk_offset 0x1000000 \
        --tags_offset 0x100 \
        --cmdline 'console=tty0 console=ttyMSM0,115200n8 clk_ignore_unused pd_ignore_unused'
    prime:
      - boot.img

build-packages:
  - bison
  - device-tree-compiler
  - dpkg-dev
  - flex
  - gcc
  - libfdt-dev
  - libssl-dev
  - mkbootimg
  - pahole
  - python3-cryptography
  - python3-pycryptodome
  - python3-pyelftools
  - python3-serial
  - rt5-clients
  - wget
